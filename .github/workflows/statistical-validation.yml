name: Statistical validation
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: Rscript CameraSpatialEncounterSurfaces2023_2024/tests/test_statistical_validation.R
  inla-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev libglpk-dev
      - name: Install analysis dependencies
        shell: Rscript {0}
        run: |
          repos <- c(INLA = "https://inla.r-inla-download.org/R/stable", getOption("repos"))
          install.packages(c("readr", "dplyr", "tidyr", "sf", "terra", "ggplot2", "viridis", "scales", "sn", "INLA"), repos = repos)
          stopifnot(requireNamespace("INLA", quietly = TRUE))
      - name: Exercise native INLA workflow on synthetic data
        env:
          CAMERA_SYNTHETIC_OUTPUT_DIR: synthetic-integration-outputs
        run: Rscript CameraSpatialEncounterSurfaces2023_2024/tests/test_inla_integration.R
      - name: Save synthetic outputs and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-integration-outputs
          path: synthetic-integration-outputs
          if-no-files-found: ignore
          retention-days: 30
